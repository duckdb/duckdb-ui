#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-main-build:
    name: Build UI extension for DuckDB main
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      ci_tools_version: main
      duckdb_version: main
      # TEMPORARY: windows_amd64 is excluded because DuckDB main does not compile with MSVC.
      # third_party/skiplist/Node.h does `#define nullptr NULL` when __cplusplus < 201103L,
      # which is always true on MSVC without /Zc:__cplusplus. In the holistic unity build,
      # quantile.cpp pulls that header in ahead of mode.cpp, so mode.cpp's
      # `allocator.Make<string_t>(nullptr, 0)` becomes `(0, 0)` and fails with C2665.
      # Put windows_amd64 back once DuckDB main changes Node.h or that call in mode.cpp.
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'windows_amd64;wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui

  duckdb-v2-0-next-build:
    name: Build UI extension for next 2.0 patch (v2.0-cyanoptera)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      ci_tools_version: v2.0-cyanoptera
      duckdb_version: v2.0-cyanoptera
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui

  duckdb-v2-0-build:
    name: Build UI extension for DuckDB v2.0.1
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      ci_tools_version: v2.0-cyanoptera
      duckdb_version: v2.0.1
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui

  duckdb-v2-0-deploy:
    if: ${{ github.repository == 'duckdb/duckdb-ui' && ( startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' ) }}
    name: Deploy UI extension for DuckDB v2.0.1
    needs: duckdb-v2-0-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v2.0-cyanoptera
    secrets: inherit
    with:
      extension_name: ui
      ci_tools_version: v2.0-cyanoptera
      duckdb_version: v2.0.1
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-v1-5-next-build:
    name: Build UI extension for next 1.5 patch (v1.5-variegata)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      ci_tools_version: v1.5-variegata
      duckdb_version: v1.5-variegata
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui

  duckdb-v1-5-build:
    name: Build UI extension for DuckDB v1.5.6
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      ci_tools_version: v1.5-variegata
      duckdb_version: v1.5.6
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui

  duckdb-v1-5-deploy:
    if: ${{ github.repository == 'duckdb/duckdb-ui' && ( startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' ) }}
    name: Deploy UI extension for DuckDB v1.5.6
    needs: duckdb-v1-5-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.5-variegata
    secrets: inherit
    with:
      extension_name: ui
      ci_tools_version: v1.5-variegata
      duckdb_version: v1.5.6
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-v1-4-next-build:
    name: Build UI extension for next 1.4 patch (v1.4-andium)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      ci_tools_version: v1.4-andium
      duckdb_version: v1.4-andium
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui
      vcpkg_commit: '84bab45d415d22042bd0b9081aea57f362da3f35'

  duckdb-v1-4-build:
    name: Build UI extension for DuckDB v1.4.5
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      ci_tools_version: v1.4-andium
      duckdb_version: v1.4.5
      exclude_archs: ${{ github.repository == 'duckdb/duckdb-ui' && 'wasm_mvp;wasm_eh;wasm_threads' || 'linux_arm64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads' }}
      extension_name: ui
      vcpkg_commit: '84bab45d415d22042bd0b9081aea57f362da3f35'

  duckdb-v1-4-deploy:
    if: ${{ github.repository == 'duckdb/duckdb-ui' && ( startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' ) }}
    name: Deploy UI extension for DuckDB v1.4.5
    needs: duckdb-v1-4-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.4-andium
    secrets: inherit
    with:
      extension_name: ui
      ci_tools_version: v1.4-andium
      duckdb_version: v1.4.5
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
